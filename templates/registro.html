{% extends 'base.html' %}
{% block title %}Registro{% endblock %}
{% block content %}
<div class="auth-bg py-5">
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
          <div class="card-header bg-warning text-dark text-center py-4">
            <i class="fas fa-user-plus fs-1 mb-2"></i>
            <h4 class="mb-0 fw-bold">Crear Cuenta</h4>
            <small>¡Es gratis y rápido!</small>
          </div>
          <div class="card-body p-4">
            <form method="POST" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Nombre *</label>
                  <input type="text" name="nombre" class="form-control" value="{{ form.get('nombre','') }}" placeholder="Tu nombre" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Apellido *</label>
                  <input type="text" name="apellido" class="form-control" value="{{ form.get('apellido','') }}" placeholder="Tu apellido" required>
                </div>
                <div class="col-12">
                  <label class="form-label fw-semibold"><i class="fas fa-envelope me-1 text-primary"></i>Correo electrónico *</label>
                  <input type="email" name="email" class="form-control" value="{{ form.get('email','') }}" placeholder="tu@correo.com" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Teléfono</label>
                  <input type="tel" name="telefono" class="form-control" value="{{ form.get('telefono','') }}" placeholder="+52 322 000 0000">
                </div>
                <div class="col-md-6"></div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold"><i class="fas fa-lock me-1 text-primary"></i>Contraseña *</label>
                  <div class="input-group">
                    <input type="password" name="password" id="pw1" class="form-control" placeholder="Mín. 6 caracteres" required>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePw('pw1',this)"><i class="fas fa-eye"></i></button>
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Confirmar contraseña *</label>
                  <div class="input-group">
                    <input type="password" name="password2" id="pw2" class="form-control" placeholder="Repite la contraseña" required>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePw('pw2',this)"><i class="fas fa-eye"></i></button>
                  </div>
                </div>
                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="terms" required>
                    <label class="form-check-label" for="terms">
                      Acepto los <a href="{{ url_for('terminos') }}" class="text-primary">Términos y Condiciones</a>
                    </label>
                  </div>
                </div>
                <div class="col-12 d-grid mt-2">
                  <button type="submit" class="btn btn-warning btn-lg fw-bold text-dark">
                    <i class="fas fa-user-plus me-2"></i>Crear Mi Cuenta
                  </button>
                </div>
              </div>
            </form>
            <hr>
            <p class="text-center mb-0">¿Ya tienes cuenta? <a href="{{ url_for('login') }}" class="text-primary fw-semibold">Inicia sesión</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
function togglePw(id, btn) {
  const f = document.getElementById(id);
  f.type = f.type === 'password' ? 'text' : 'password';
  btn.innerHTML = f.type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
}
</script>
{% endblock %}
