{% extends 'base.html' %}
{% block title %}Iniciar Sesión{% endblock %}
{% block content %}
<div class="auth-bg py-5">
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
          <div class="card-header bg-primary text-white text-center py-4">
            <i class="fas fa-user-circle fs-1 mb-2"></i>
            <h4 class="mb-0 fw-bold">Iniciar Sesión</h4>
          </div>
          <div class="card-body p-4">
            <form method="POST" novalidate>
              <div class="mb-3">
                <label class="form-label fw-semibold"><i class="fas fa-envelope me-1 text-primary"></i>Correo electrónico</label>
                <input type="email" name="email" class="form-control form-control-lg" placeholder="tu@correo.com" required>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold"><i class="fas fa-lock me-1 text-primary"></i>Contraseña</label>
                <div class="input-group">
                  <input type="password" name="password" id="pw" class="form-control form-control-lg" placeholder="••••••" required>
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePw('pw',this)"><i class="fas fa-eye"></i></button>
                </div>
              </div>
              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg fw-bold">
                  <i class="fas fa-sign-in-alt me-2"></i>Ingresar
                </button>
              </div>
            </form>
            <hr>
            <p class="text-center mb-0">¿No tienes cuenta? <a href="{{ url_for('registro') }}" class="text-primary fw-semibold">Regístrate aquí</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
function togglePw(id, btn) {
  const f = document.getElementById(id);
  f.type = f.type === 'password' ? 'text' : 'password';
  btn.innerHTML = f.type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
}
</script>
{% endblock %}
